name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build database
        run: python data/seed.py
      - name: Run QA tests
        run: python demo/test_qa_review.py
      - name: Run audit log and freshness tests
        run: python demo/test_audit_and_freshness.py
      - name: Run closing-the-loop test (add_faq.py)
        run: python demo/test_add_faq.py
      - name: Run KPI test
        run: python demo/test_kpi.py
      - name: Run agent smoke test
        run: python demo/demo.py
